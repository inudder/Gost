{% extends "base.html" %}
{% block title %}Nodes | {{ app_title }}{% endblock %}
{% block content %}
<section class="space-y-6">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-white">Nodes / Proxies</h1>
      <p class="text-sm text-slate-400">Manual SOCKS5 proxies and GOST-imported endpoints in one table.</p>
    </div>
    <div class="flex items-center gap-3">
      <form hx-post="/nodes/actions/check-all" hx-target="#nodes-alert" hx-swap="innerHTML">
        <button type="submit" class="rounded-full border border-cyan-400/30 bg-cyan-500/10 px-4 py-2 text-sm text-cyan-100 hover:bg-cyan-500/20">
          Check all enabled
        </button>
      </form>
      <a href="/nodes/new" class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200 hover:bg-white/10">
        Add proxy
      </a>
    </div>
  </div>
  <div id="nodes-alert"></div>
  <div id="nodes-table">
    {% include "partials/nodes_table.html" %}
  </div>
</section>
{% endblock %}
